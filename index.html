<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#3c4a68;
    --parchment:#F7F3E8;
    --parchment-dim:#EFE9D8;
    --card:#FFFDF7;
    --ochre:#C89B3C;
    --ochre-deep:#a97e28;
    --teal:#2E6E62;
    --line: rgba(27,42,74,0.16);
    --shadow: 0 1px 0 rgba(27,42,74,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(27,42,74,0.07) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    padding: 28px 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  /* ---- Pantalla de Inicio ---- */
  #homeScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
  }
  .home-card {
    background: var(--card);
    width: 100%;
    max-width: 440px;
    border-radius: 8px;
    border: 2px solid var(--ink);
    box-shadow: 0 8px 0 rgba(27,42,74,0.18);
    padding: 30px;
    margin-top: 30px;
    text-align: left;
  }
  .home-card p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin-top: 0;
    margin-bottom: 24px;
  }
  
  header{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    border-bottom: 2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom: 26px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    font-weight:600;
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: clamp(32px, 5vw, 52px);
    margin:0;
    line-height:0.98;
    letter-spacing:-0.01em;
  }
  h1 em{
    font-style:italic;
    font-weight:500;
    color:var(--ochre-deep);
  }
  .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:right;
    line-height:1.6;
  }
  .meta b{color:var(--ink);}

  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:22px;
    align-items: center;
  }

  .tabs{
    display:flex;
    gap:0;
    margin-bottom:18px;
    border-bottom:1.5px solid var(--ink);
  }
  .tab-btn{
    border:none;
    background:transparent;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:10px 4px;
    margin-right:22px;
    cursor:pointer;
    color:var(--ink-soft);
    border-bottom:3px solid transparent;
    border-radius:0;
    position:relative;
    top:1.5px;
  }
  .tab-btn:hover{ background:transparent; color:var(--ink); }
  .tab-btn.on{ color:var(--ink); border-bottom-color:var(--ochre-deep); }

  /* ---- Calendar ---- */
  .cal-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  button.sq{ padding:8px 12px; }
  .cal-title{
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:700;
    min-width:150px;
    text-align:center;
    text-transform:capitalize;
  }
  .notif-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .notif-hint a{ color:var(--teal); cursor:pointer; text-decoration:underline; }

  .cal-board{
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:4px;
    box-shadow: 0 3px 0 var(--ink);
    overflow:hidden;
  }
  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    background:var(--parchment-dim);
    border-bottom:2px solid var(--ink);
  }
  .cal-weekdays div{
    text-align:center;
    padding:9px 2px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
  }
  .cal-cell{
    min-height:64px;
    border-right:1px solid var(--line);
    border-top:1px solid var(--line);
    padding:6px 5px;
    cursor:pointer;
    position:relative;
    transition: background .1s ease;
  }
  .cal-cell:nth-child(7n){ border-right:none; }
  .cal-cell:hover{ background:var(--parchment-dim); }
  .cal-cell.other-month{ opacity:.35; }
  .cal-cell.today{ background: rgba(200,155,60,0.14); }
  .cal-cell .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
  }
  .cal-cell.today .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px; height:20px;
    background:var(--ochre-deep);
    color:#fff;
    border-radius:50%;
  }
  .cal-dots{ display:flex; gap:3px; flex-wrap:wrap; margin-top:5px; }
  .cal-dot{ width:6px; height:6px; border-radius:50%; }

  .cal-upcoming{ margin-top:22px; }
  .cal-upcoming h2{
    font-family:'Fraunces', serif;
    font-size:18px;
    font-weight:600;
    margin:0 0 10px;
  }
  .up-item{
    display:flex;
    gap:12px;
    align-items:flex-start;
    background:var(--card);
    border:1px solid var(--ink);
    border-radius:4px;
    padding:11px 14px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .up-item:hover{ background:var(--parchment-dim); }
  .up-item .date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--teal);
    font-weight:600;
    white-space:nowrap;
    padding-top:2px;
  }
  .up-item .name{ font-family:'Fraunces', serif; font-weight:600; font-size:14.5px; }
  .up-item .sub{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .up-empty{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); font-style:italic; }

  .event-list-item{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-top:1px solid var(--line);
  }
  .event-list-item:first-child{ border-top:none; }
  .event-list-item .del{
    border:1px solid var(--line);
    color:var(--ink-soft);
    background:none;
    border-radius:50%;
    width:26px; height:26px;
    font-size:14px;
    padding:0;
    flex-shrink:0;
  }
  .event-list-item .del:hover{ background:#9B3B3B; border-color:#9B3B3B; color:#fff; }
  button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    border-radius:3px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    padding:9px 16px;
    transition: all .15s ease;
  }
  button:hover{ background:var(--ink); color:var(--parchment); }
  button.primary{ background:var(--ink); color:var(--parchment); }
  button.primary:hover{ background:var(--ochre-deep); border-color:var(--ochre-deep); color:#fff; }
  button.ghost{ border-color:var(--line); color:var(--ink-soft); }
  button.ghost:hover{ background:var(--ink-soft); color:#fff; border-color:var(--ink-soft); }
  button.save-btn { background: var(--teal); border-color: var(--teal); color: white; }
  button.save-btn:hover { background: #22564c; border-color: #22564c; color: white; }
  button:focus-visible, [tabindex]:focus-visible, select:focus-visible, input:focus-visible{
    outline: 2px solid var(--teal); outline-offset:2px;
  }

  /* ---- Grid timetable ---- */
  .board{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:4px;
    overflow:hidden;
    box-shadow: 0 3px 0 var(--ink);
  }
  .grid{
    display:grid;
    grid-template-columns: 58px repeat(5, 1fr);
  }
  .corner{
    border-right:1px solid var(--line);
    border-bottom:2px solid var(--ink);
    background:var(--parchment-dim);
  }
  .daycol-head{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    text-align:center;
    padding:12px 4px;
    border-bottom:2px solid var(--ink);
    border-right:1px solid var(--line);
    background:var(--parchment-dim);
    color:var(--ink-soft);
    font-weight:600;
  }
  .daycol-head:last-child{border-right:none;}
  .daycol-head .full{display:block; font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--ink); text-transform:none; letter-spacing:0; margin-top:2px;}

  .hour-row{
    grid-column: 1;
    border-right:1px solid var(--line);
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color: var(--ink-soft);
    text-align:right;
    padding:3px 6px 0 0;
    height:56px;
  }
  .cell{
    border-right:1px solid var(--line);
    border-top:1px solid var(--line);
    height:56px;
    position:relative;
  }
  .cell:nth-child(6n){border-right:none;}

  .class-block{
    position:absolute;
    left:3px; right:3px;
    border-radius:3px;
    border:1px solid var(--ink);
    padding:6px 8px 5px;
    overflow:hidden;
    cursor:pointer;
    transition: transform .1s ease, box-shadow .1s ease;
    box-shadow: 1px 1px 0 rgba(27,42,74,0.25);
    z-index:2;
  }
  .class-block:hover{ transform: translateY(-1px); box-shadow: 2px 3px 0 rgba(27,42,74,0.35); z-index:5; }
  .class-block .code{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    opacity:.75;
    letter-spacing:.03em;
  }
  .class-block .name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:12.5px;
    line-height:1.15;
    margin:1px 0 2px;
  }
  .class-block .room{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    opacity:.85;
  }

  /* palette rotation for classes */
  .c0{ background:#E7DAB4; }
  .c1{ background:#D7E4DE; }
  .c2{ background:#EAD2C7; }
  .c3{ background:#DAD9EC; }
  .c4{ background:#F0DCE4; }
