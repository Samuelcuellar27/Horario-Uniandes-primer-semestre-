<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario de Arquitectura</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #e74c3c;
            --bg: #ecf0f1;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg);
            color: #333;
            padding: 20px; 
            margin: 0;
        }
        .container { 
            max-width: 900px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h1 { text-align: center; color: var(--primary); }
        .controls { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin-bottom: 25px; 
            flex-wrap: wrap;
        }
        input[type="text"] { 
            padding: 10px; 
            border: 1px solid #bdc3c7; 
            border-radius: 5px; 
        }
        button { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 5px; 
            background-color: var(--primary); 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #1a252f; }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 12px; 
            text-align: center; 
        }
        th { background-color: var(--primary); color: white; }
        .cell-input { 
            width: 90%; 
            border: none; 
            background: transparent; 
            text-align: center;
        }
        .cell-input:focus { outline: none; border-bottom: 2px solid var(--secondary); }
        #status { text-align: center; font-weight: bold; margin-top: 15px; color: var(--secondary); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mi Horario Universitario</h1>
        
        <div class="controls">
            <input type="text" id="accessCode" placeholder="Ingresa tu código (Ej: ANDES-01)">
            <button id="loadBtn">Cargar</button>
            <button id="saveBtn">Guardar Sincronización</button>
        </div>
        
        <table id="scheduleTable">
            <thead>
                <tr>
                    <th>Bloque</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>07:00 - 09:00</td>
                    <td><input type="text" class="cell-input" id="L1" placeholder="Ej: Taller"></td>
                    <td><input type="text" class="cell-input" id="M1"></td>
                    <td><input type="text" class="cell-input" id="X1"></td>
                    <td><input type="text" class="cell-input" id="J1"></td>
                    <td><input type="text" class="cell-input" id="V1"></td>
                </tr>
                <tr>
                    <td>09:00 - 11:00</td>
                    <td><input type="text" class="cell-input" id="L2"></td>
                    <td><input type="text" class="cell-input" id="M2"></td>
                    <td><input type="text" class="cell-input" id="X2" placeholder="Ej: Dibujo"></td>
                    <td><input type="text" class="cell-input" id="J2"></td>
                    <td><input type="text" class="cell-input" id="V2"></td>
                </tr>
                <tr>
                    <td>11:00 - 13:00</td>
                    <td><input type="text" class="cell-input" id="L3"></td>
                    <td><input type="text" class="cell-input" id="M3"></td>
                    <td><input type="text" class="cell-input" id="X3"></td>
                    <td><input type="text" class="cell-input" id="J3"></td>
                    <td><input type="text" class="cell-input" id="V3"></td>
                </tr>
                <tr>
                    <td>14:00 - 16:00</td>
                    <td><input type="text" class="cell-input" id="L4"></td>
                    <td><input type="text" class="cell-input" id="M4"></td>
                    <td><input type="text" class="cell-input" id="X4"></td>
                    <td><input type="text" class="cell-input" id="J4"></td>
                    <td><input type="text" class="cell-input" id="V4"></td>
                </tr>
            </tbody>
        </table>
        
        <p id="status"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ⚠️ IMPORTANTE: Aquí pegas los datos de tu proyecto de Firebase
        const firebaseConfig = {
            const firebaseConfig = {
            apiKey: "AIzaSyD1234567890abcdefghijklmnopqrst",
            authDomain: "mi-horario-123.firebaseapp.com",
            projectId: "mi-horario-123",
            storageBucket: "mi-horario-123.appspot.com",
            messagingSenderId: "987654321098",
            appId: "1:987654321098:web:a1b2c3d4e5f6g7h8"

        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Referencias a los elementos del DOM
        const accessCodeInput = document.getElementById('accessCode');
        const loadBtn = document.getElementById('loadBtn');
        const saveBtn = document.getElementById('saveBtn');
        const statusText = document.getElementById('status');
        const inputs = document.querySelectorAll('.cell-input');

        // Función para guardar
        async function saveSchedule() {
            const code = accessCodeInput.value.trim();
            if (!code) return showStatus("Por favor ingresa un código de acceso.", true);

            showStatus("Guardando en la nube...");
            const scheduleData = {};
            inputs.forEach(input => {
                if(input.value) scheduleData[input.id] = input.value;
            });

            try {
                await setDoc(doc(db, "horarios", code), scheduleData);
                showStatus("¡Horario sincronizado correctamente!");
            } catch (e) {
                console.error("Error: ", e);
                showStatus("Error al guardar. Verifica la consola.", true);
            }
        }

        // Función para cargar
        async function loadSchedule() {
            const code = accessCodeInput.value.trim();
            if (!code) return showStatus("Por favor ingresa un código de acceso.", true);

            showStatus("Buscando tu horario...");
            try {
                const docSnap = await getDoc(doc(db, "horarios", code));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    inputs.forEach(input => {
                        input.value = data[input.id] || "";
                    });
                    showStatus("¡Horario cargado con éxito!");
                } else {
                    showStatus("No se encontró ningún horario con ese código. ¡Crea uno nuevo!", true);
                    inputs.forEach(input => input.value = "");
                }
            } catch (e) {
                console.error("Error: ", e);
                showStatus("Error al cargar. Verifica la consola.", true);
            }
        }

        function showStatus(message, isError = false) {
            statusText.innerText = message;
            statusText.style.color = isError ? "#e74c3c" : "#27ae60";
        }

        saveBtn.addEventListener('click', saveSchedule);
        loadBtn.addEventListener('click', loadSchedule);
    </script>
</body>
</html>
